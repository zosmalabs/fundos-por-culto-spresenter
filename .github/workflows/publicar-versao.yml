name: Publicar versão

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - package.json
      - src/**
      - .github/workflows/publicar-versao.yml

permissions:
  contents: write

jobs:
  publicar:
    name: Compilar e publicar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run package

      - name: Ler versão e preparar arquivo
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          SOURCE="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$SOURCE"
          TARGET="Fundos-por-Culto-Spresenter-$VERSION.zip"
          cp "$SOURCE" "$TARGET"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Fundos por Culto v${{ steps.version.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.version.outputs.file }}
